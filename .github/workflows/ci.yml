# Free plugin checks on its own. The parent repo (listenly-voice-docker) also builds both
# plugins, runs assert-no-pro and makes the zips.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer
      - name: Install
        run: |
          pnpm install --frozen-lockfile
          composer install --no-interaction
      - name: Typecheck and build
        run: pnpm typecheck && pnpm build
      - name: Tests
        run: pnpm test && pnpm test:php
      - name: Coding standards
        run: vendor/bin/phpcs
